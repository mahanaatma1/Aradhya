name: divyavaani
description: "DivyaVaani - your daily spiritual companion"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.6.2
  # Local bundled content DB (read-only) + writable user DB
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  # Device GPS for panchang location
  geolocator: ^13.0.2
  # Small key-value user state
  shared_preferences: ^2.3.4
  # Share result cards + save to gallery
  share_plus: ^13.2.0
  gal: ^2.3.1
  # Open temple map links / external URLs
  url_launcher: ^6.3.1
  # i18n message formatting
  intl: any
  home_widget: ^0.9.3
  sweph: ^3.2.1+2.10.3
  flutter_tts: ^4.2.5
  # Keep the screen awake during a breathing session
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FBEFDD"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/content.sqlite
    - assets/images/

  fonts:
    - family: Eczar
      fonts:
        - asset: assets/fonts/Eczar.ttf
    - family: Ramaraja
      fonts:
        - asset: assets/fonts/Ramaraja-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
