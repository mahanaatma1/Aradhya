<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Aradhya — Explore India's Spiritual Wisdom">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FDF8F5" />
      <stop offset="0.6" stop-color="#F7ECDC" />
      <stop offset="1" stop-color="#F1D9B9" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C0A062" stop-opacity="0.34" />
      <stop offset="1" stop-color="#C0A062" stop-opacity="0" />
    </radialGradient>

    <!-- Lotus gradients, spanning the mark's own 512-unit grid (see favicon.svg). -->
    <linearGradient id="lgold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#EFCB6A" />
      <stop offset="1" stop-color="#B48B3E" />
    </linearGradient>
    <linearGradient id="lterra" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#B23A18" />
      <stop offset="1" stop-color="#6E1F10" />
    </linearGradient>
    <linearGradient id="lcore" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#9A2E12" />
      <stop offset="1" stop-color="#6E1F10" />
    </linearGradient>
    <filter id="tileshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6.9" stdDeviation="6" flood-color="#A73015" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)" />
  <circle cx="980" cy="150" r="360" fill="url(#glow)" />

  <!-- sacred-geometry ring -->
  <g transform="translate(980 315)" stroke="#A73015" stroke-opacity="0.16" fill="none">
    <circle r="200" stroke-width="1.4" />
    <circle r="150" stroke-width="1.4" stroke-dasharray="6 6" />
    <circle r="96" stroke-width="1.4" />
    <g stroke-width="1.2">
      <ellipse rx="196" ry="76" />
      <ellipse rx="196" ry="76" transform="rotate(60)" />
      <ellipse rx="196" ry="76" transform="rotate(120)" />
    </g>
  </g>

  <g transform="translate(96 168)">
    <!-- The logo tile, 86px, drawn on the app's 512 grid and scaled down. -->
    <g filter="url(#tileshadow)">
      <g transform="scale(0.16796875)">
        <rect width="512" height="512" rx="133.12" fill="#FBEFDD" />
        <g fill="url(#lgold)">
          <path d="M256 300C174 193.3 223.2 106 256 106C288.8 106 338 193.3 256 300Z" transform="rotate(-66 256 300)" />
          <path d="M256 300C174 193.3 223.2 106 256 106C288.8 106 338 193.3 256 300Z" transform="rotate(-33 256 300)" />
          <path d="M256 300C174 193.3 223.2 106 256 106C288.8 106 338 193.3 256 300Z" />
          <path d="M256 300C174 193.3 223.2 106 256 106C288.8 106 338 193.3 256 300Z" transform="rotate(33 256 300)" />
          <path d="M256 300C174 193.3 223.2 106 256 106C288.8 106 338 193.3 256 300Z" transform="rotate(66 256 300)" />
        </g>
        <g fill="url(#lterra)">
          <path d="M256 300C186 202.1 228 122 256 122C284 122 326 202.1 256 300Z" transform="rotate(-42 256 300)" />
          <path d="M256 300C186 202.1 228 122 256 122C284 122 326 202.1 256 300Z" transform="rotate(-14 256 300)" />
          <path d="M256 300C186 202.1 228 122 256 122C284 122 326 202.1 256 300Z" transform="rotate(14 256 300)" />
          <path d="M256 300C186 202.1 228 122 256 122C284 122 326 202.1 256 300Z" transform="rotate(42 256 300)" />
        </g>
        <path d="M256 300C198 192.2 232.8 104 256 104C279.2 104 314 192.2 256 300Z" fill="url(#lcore)" />
        <path d="M106 306Q256 370 406 306Q256 334 106 306Z" fill="#C7A24E" />
        <rect x="56.32" y="56.32" width="399.36" height="399.36" rx="82.53" fill="none"
              stroke="#A73015" stroke-opacity="0.38" stroke-width="7.17" stroke-dasharray="28.16 20.48" />
      </g>
    </g>

    <text x="106" y="42" font-family="Eczar,Georgia,serif" font-size="46" fill="#3A2214" letter-spacing="1">
      Ara<tspan fill="#A73015">dhya</tspan>
    </text>
    <text x="108" y="72" font-family="Inter,'Segoe UI',sans-serif" font-size="19" fill="#6F4C37"
          letter-spacing="3.4">DEVOTION, EVERY DAY</text>
  </g>

  <text x="96" y="356" font-family="Eczar,Georgia,serif" font-size="66" fill="#3A2214">Explore India's</text>
  <text x="96" y="428" font-family="Eczar,Georgia,serif" font-size="66" fill="#A73015">Spiritual Wisdom.</text>
  <text x="96" y="484" font-family="Inter,'Segoe UI',sans-serif" font-size="24" fill="#6F4C37">
    Scriptures · Ramayana · Mahabharata · Temples · Festivals · Practice
  </text>

  <g transform="translate(96 524)">
    <rect width="470" height="58" rx="29" fill="#FFFDF9" stroke="#A73015" stroke-opacity="0.2" />
    <circle cx="34" cy="29" r="9" fill="none" stroke="#A73015" stroke-width="2.4" />
    <line x1="41" y1="36" x2="48" y2="43" stroke="#A73015" stroke-width="2.4" stroke-linecap="round" />
    <text x="66" y="37" font-family="Inter,'Segoe UI',sans-serif" font-size="20" fill="#9A7C67">
      Search scriptures, deities, stories, temples…
    </text>
  </g>
</svg>
